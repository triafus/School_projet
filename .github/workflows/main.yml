name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type (patch, minor, major)'
        required: true
        default: 'patch'

jobs:
  integration:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run security audit
        run: pnpm audit --prod

      - name: Run lint
        run: |
          cd client && pnpm run lint
          cd ../server && pnpm run lint

      - name: Build client and server
        run: |
          cd client && pnpm run build
          cd ../server && pnpm run build

      - name: Setup Test Environment
        run: |
          cd server
          echo "USE_SQLITE=true" > .env.test
          echo "DB_HOST=localhost" >> .env.test
          echo "DB_PORT=5432" >> .env.test
          echo "DB_USERNAME=postgres" >> .env.test
          echo "DB_PASSWORD=postgres" >> .env.test
          echo "DB_DATABASE=test_db" >> .env.test
          echo "JWT_SECRET=test-secret-key-for-ci-cd-12345" >> .env.test
          echo "NODE_ENV=test" >> .env.test
          echo "SUPABASE_URL=http://localhost/fake" >> .env.test
          echo "SUPABASE_SERVICE_ROLE_KEY=fake-key-12345" >> .env.test

      - name: Run tests
        run: |
          cd server
          pnpm run test
          pnpm run test:e2e

  release_and_deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        run: |
          NEW_VER=$(npm --no-git-tag-version version ${{ github.event.inputs.version_bump }})
          git commit -am "chore(release): bump version to $NEW_VER"
          git tag -a "$NEW_VER" -m "Release $NEW_VER"
          echo "version=$NEW_VER" >> $GITHUB_OUTPUT

      - name: Push changes and tags
        run: git push --follow-tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.version }}
          generate_release_notes: true