name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_action:
        description: 'Deploy to production?'
        required: true
        type: choice
        options:
          - "no"
          - "yes"

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v3
        with:
          version: 8
      - run: cd client && pnpm install --no-frozen-lockfile
      - run: cd client && pnpm run lint
      - run: cd client && pnpm audit --prod --audit-level=high
      - run: cd client && pnpm run build

  backend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v3
        with:
          version: 8
      - run: cd server && pnpm install --no-frozen-lockfile
      - run: cd server && pnpm run lint
      - run: cd server && pnpm audit --prod --audit-level=high
      - run: cd server && pnpm run build

  frontend-unit-test:
    needs: frontend-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v3
        with:
          version: 8
      - run: cd client && pnpm install --no-frozen-lockfile
      - run: cd client && pnpm run test

  backend-unit-test:
    needs: backend-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v3
        with:
          version: 8
      - run: cd server && pnpm install --no-frozen-lockfile
      - run: cd server && pnpm run test

  integration-test:
    needs: [frontend-unit-test, backend-unit-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v3
        with:
          version: 8
      - run: |
          cd client && pnpm install --no-frozen-lockfile
          cd ../server && pnpm install --no-frozen-lockfile
      - run: |
          cd server
          echo "USE_SQLITE=true" > .env.test
          echo "DB_HOST=localhost" >> .env.test
          echo "DB_PORT=5432" >> .env.test
          echo "DB_USERNAME=postgres" >> .env.test
          echo "DB_PASSWORD=postgres" >> .env.test
          echo "DB_DATABASE=test_db" >> .env.test
          echo "JWT_SECRET=test-secret-key-for-ci-cd-12345" >> .env.test
          echo "NODE_ENV=test" >> .env.test
          echo "SUPABASE_URL=http://localhost/fake" >> .env.test
          echo "SUPABASE_SERVICE_ROLE_KEY=fake-key-12345" >> .env.test
      - run: cd server && pnpm run test

  e2e-test:
    needs: integration-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v3
        with:
          version: 8
      - run: |
          cd client && pnpm install --no-frozen-lockfile
          cd ../server && pnpm install --no-frozen-lockfile
      - run: cd server && pnpm run test:e2e

  deploy-production:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_action == 'yes'
    needs: e2e-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v3
        with:
          version: 8
      - run: |
          cd client && pnpm install --no-frozen-lockfile
          cd ../server && pnpm install --no-frozen-lockfile
      - run: |
          cd client && pnpm run build
          cd ../server && pnpm run build
      - name: Deploy to Vercel
        run: |
          npm install -g vercel
          vercel --prod --token=${{ secrets.VERCEL_TOKEN }}