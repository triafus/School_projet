name: CI/CD Workflow

on:
  push:
    branches:
      - main
      - feat/9---CICD-github-action
      - feature/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Setup Test Environment
        run: |
          cd server
          echo "USE_SQLITE=true" > .env.test
          echo "DB_HOST=localhost" >> .env.test
          echo "DB_PORT=5432" >> .env.test
          echo "DB_USERNAME=postgres" >> .env.test
          echo "DB_PASSWORD=postgres" >> .env.test
          echo "DB_DATABASE=test_db" >> .env.test
          echo "JWT_SECRET=test-secret-key-for-ci-cd-12345" >> .env.test
          echo "NODE_ENV=test" >> .env.test
          echo "SUPABASE_URL=http://localhost/fake" >> .env.test
          echo "SUPABASE_SERVICE_ROLE_KEY=fake-key-12345" >> .env.test

      - name: Run Server Unit Tests
        run: pnpm --filter server run test
        env:
          CI: true

      - name: Run Server E2E Tests
        run: pnpm --filter server run test:e2e:ci
        env:
          CI: true
        timeout-minutes: 10

      - name: Build Client
        run: pnpm --filter client run build
        env:
          NODE_ENV: production

      - name: Build Server
        run: pnpm --filter server run build
        env:
          NODE_ENV: production

      - name: Upload Client Build
        uses: actions/upload-artifact@v4
        with:
          name: client-build
          path: client/dist/

      - name: Upload Server Build
        uses: actions/upload-artifact@v4
        with:
          name: server-build
          path: server/dist/